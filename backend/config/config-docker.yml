logger:
  Development: true
  DisableCaller: false
  DisableStacktrace: false
  Encoding: "console"
  Level: "info"
  # aioredis_logging: false
  # uvicorn_logging: true
  # sqlalchemy_logging: false
  # protocol_logging: false

postgres:
  PostgresqlHost: postgesql
  PostgresqlPort: 5432
  PostgresqlUser: admin
  PostgresqlPassword: password
  PostgresqlDbname: app_db
  PostgresqlSslmode: false
  PgDriver: postgresql+asyncpg

redis:
  RedisAddr: redis:6379
  RedisPassword:
  RedisDb: 0
  RedisDefaultdb: 0
  MinIdleConns: 200
  PoolSize: 12000
  PoolTimeout: 240
  Password: "password"
  DB: 0

aws:
  Endpoint: 127.0.0.1:9000
  MinioAccessKey: minioadmin
  MinioSecretKey: minioadminpassword
  UseSSL: false
  MinioEndpoint: http://127.0.0.1:9000

