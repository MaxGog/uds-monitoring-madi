<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему MADI</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f1f5f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        .group { margin-bottom: 1rem; display: flex; flex-direction: column; }
        label { margin-bottom: .5rem; font-size: 14px; color: #475569; }
        input { padding: .5rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: .75rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        .error { color: #dc2626; font-size: 14px; margin-bottom: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="text-align: center; margin-top: 0;">Авторизация бэкенда</h3>
        
    <form id="authForm">
        <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
        <input type="hidden" name="code_challenge" value="{{ code_challenge }}">

        <div class="group">
            <label>Email:</label>
            <input type="email" name="email" id="email" value="admin@madi.ru" required>
        </div>
        <div class="group">
            <label>Пароль:</label>
            <input type="password" name="password" id="password" value="secret" required>
        </div>

        <button type="submit" id="submitBtn">Войти</button>
    </form>
        
    </div>
</body>
      <script lang='javascript' type='module'>
                document.getElementById('authForm').addEventListener('submit', async (event) => {
            event.preventDefault(); 

            const form = event.target;
            const csrfToken = document.getElementById('csrf_token').value;
            const formData = new URLSearchParams(new FormData(form));

            try {
                const response = await fetch('/auth/login-submit', {
                    method: 'POST',
                    headers: {
                        'X-CSRF-Token': csrfToken,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.url) {
                        // Чистый редирект силами JS. Никакого CORS-конфликта!
                        window.location.href = result.url;
                    }
                } else {
                    const result = await response.json();
                    alert(`Ошибка: ${result.detail || 'Неизвестная ошибка бэка'}`);
                }
            } catch (error) {
                console.error('Сетевая ошибка:', error);
                alert('Не удалось связаться с сервером');
            }
        });
      </script>
</html>
