<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест S3 Presigned Upload (Auth)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; white-space: pre-wrap; word-break: break-all; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .token-field { background: #fdf6e2; border: 1px solid #e6dbb9; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Тестирование загрузки в MinIO</h2>
    
    <div class="form-group token-field">
        <label for="tokenInput" style="color: #856404;">Access Token (JWT):</label>
        <input type="text" id="tokenInput" placeholder="Вставьте сюда Bearer токен или передайте через URL ?token=...">
    </div>

    <div class="form-group">
        <label for="fileInput">Выберите файл:</label>
        <input type="file" id="fileInput">
    </div>
    <div class="form-group">
        <label for="ownerType">Тип привязки (owner_type):</label>
        <select id="ownerType">
            <option value="">Null (Без привязки)</option>
            <option value="contract">Contract (Договор)</option>
            <option value="act">Act (Акт)</option>
            <option value="object">Object (Объект)</option>
            <option value="work">Work (Работа)</option>
        </select>
    </div>
    <div class="form-group">
        <label for="ownerId">ID сущности (owner_id):</label>
        <input type="number" id="ownerId" value="45">
    </div>
    
    <button onclick="startUpload()">Загрузить файл</button>
    
    <div id="status"></div>

    <script>
        // АВТОПОДСТАВКА: проверяем токен в строке браузера при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            if (tokenFromUrl) {
                document.getElementById('tokenInput').value = tokenFromUrl;
            }
        });

        async function startUpload() {
            const fileInput = document.getElementById('fileInput');
            const ownerType = document.getElementById('ownerType').value;
            const ownerId = document.getElementById('ownerId').value;
            const token = document.getElementById('tokenInput').value.trim();
            
            if (!fileInput.files.length) {
                alert('Пожалуйста, выберите файл!');
                return;
            }
            
            const file = fileInput.files[0];
            showStatus('Шаг 1: Запрос Presigned URL...', 'success');
            
            try {
                const getUploadUrlData = {
                    name: file.name,
                    content_type: file.type || 'application/octet-stream',
                    owner_type: ownerType ? ownerType : null,
                    owner_id: ownerType ? parseInt(ownerId) : null
                };

                const requestPayload = {
                    data: getUploadUrlData
                };
                
                // Формируем заголовки для FastAPI
                const apiHeaders = { 'Content-Type': 'application/json' };
                
                // Если токен заполнен — прикрепляем к запросу ссылки
                if (token) {
                    apiHeaders['Authorization'] = `Bearer ${token}`;
                }
                
                const response = await fetch('/fs/request-upload', {
                    method: 'POST',
                    headers: apiHeaders,
                    body: JSON.stringify(requestPayload)
                });
                
                if (!response.ok) {
                    const errBody = await response.json();
                    showStatus(`Ошибка FastAPI (${response.status}):\n${JSON.stringify(errBody, null, 2)}`, 'error');
                    return;
                }
                
                const resJson = await response.json();
                const uploadData = resJson.data;
                
                showStatus('Шаг 2: Отправка файла напрямую в MinIO...', 'success');
                
                // Загружаем файл напрямую в MinIO (для PUT-ссылки MinIO токен Bearer НЕ НУЖЕН, 
                // так как в ссылке уже зашита сигнатура AWS, но нужны метаданные)
                const minioHeaders = new Headers();
                minioHeaders.append('Content-Type', file.type || 'application/octet-stream');
                if (token) {
    try {
        // JWT состоит из 3 частей через точку. Нам нужна вторая часть (payload)
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        const payload = JSON.parse(jsonPayload);
        
        // Достаем 'sub' (или проверьте, возможно в вашем токене ID лежит в 'user_id')
        const uploaderId = payload.sub; 
        
        if (uploaderId) {
            // Имя заголовка должно СТРОГО совпадать с тем, что ожидает s3_repository
            minioHeaders.append('x-amz-meta-uploader-id', uploaderId);
            console.log("В MinIO отправлен uploader_id из токена:", uploaderId);
        }
    } catch (e) {
        console.error("Не удалось распарсить JWT-токен для метаданных:", e);
    }
}
                if (getUploadUrlData.owner_type) {
                    minioHeaders.append('x-amz-meta-owner-type', getUploadUrlData.owner_type);
                    minioHeaders.append('x-amz-meta-owner-id', getUploadUrlData.owner_id.toString());
                }
                
                const putResponse = await fetch(uploadData.upload_url, {
                    method: 'PUT',
                    headers: minioHeaders,
                    body: file
                });
                
                if (putResponse.ok) {
                    showStatus('🚀 Файл успешно загружен!\n\nFastAPI проверил ваш токен, выдал ссылку, а MinIO принял файл и отправил вебхук.', 'success');
                } else {
                    const errText = await putResponse.text();
                    showStatus('Ошибка загрузки в MinIO: ' + errText, 'error');
                }
                
            } catch (error) {
                showStatus('Произошла ошибка: ' + error.message, 'error');
            }
        }
        
        function showStatus(text, className) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = text;
            statusDiv.className = className;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
