<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Тест S3 Presigned Upload</title>
        <style>
            body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
            .form-group { margin-bottom: 15px; }
            label { display: block; margin-bottom: 5px; font-weight: bold; }
            input, select { width: 100%; padding: 8px; box-sizing: border-box; }
            button { background: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
            button:hover { background: #0056b3; }
            #status { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
            .success { background: #d4edda; color: #155724; }
            .error { background: #f8d7da; color: #721c24; }
        </style>
    </head>
    <body>
        <h2>Тестирование загрузки в MinIO</h2>
        
        <div class="form-group">
            <label for="fileInput">Выберите файл:</label>
            <input type="file" id="fileInput">
        </div>
        <div class="form-group">
            <label for="ownerType">Тип привязки (owner_type):</label>
            <select id="ownerType">
                <option value="contract">Contract (Договор)</option>
                <option value="act">Act (Акт)</option>
                <option value="object">Object (Объект)</option>
                <option value="work">Work (Работа)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="ownerId">ID сущности (owner_id):</label>
            <input type="number" id="ownerId" value="45">
        </div>
        
        <button onclick="startUpload()">Загрузить файл</button>
        
        <div id="status"></div>

        <script>
            async function startUpload() {
                const fileInput = document.getElementById('fileInput');
                const ownerType = document.getElementById('ownerType').value;
                const ownerId = document.getElementById('ownerId').value;
                const statusDiv = document.getElementById('status');
                
                if (!fileInput.files.length) {
                    alert('Пожалуйста, выберите файл!');
                    return;
                }
                
                const file = fileInput.files[0];
                showStatus('Шаг 1: Запрос Presigned URL...', 'success');
                
                try {
                    // 1. Запрашиваем у нашего FastAPI ссылку для загрузки
                    const requestPayload = {
                        file_name: file.name,
                        content_type: file.type || 'application/octet-stream',
                        uploader_id: "00000000-0000-0000-0000-000000000000", // Тестовый UUID юзера
                        owner_type: ownerType,
                        owner_id: parseInt(ownerId)
                    };
                    
                    const response = await fetch('/api/v1/documents/request-upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestPayload)
                    });
                    
                    const resJson = await response.json();
                    const uploadData = resJson.data;
                    
                    showStatus('Шаг 2: Отправка файла напрямую в MinIO...', 'success');
                    
                    // 2. Загружаем файл напрямую в MinIO методом PUT
                    // КРИТИЧЕСКИ ВАЖНО: Передать те же заголовки метаданных, что зашиты в ссылке!
                    const minioHeaders = new Headers();
                    minioHeaders.append('Content-Type', file.type || 'application/octet-stream');
                    minioHeaders.append('x-amz-meta-uploader-id', requestPayload.uploader_id);
                    minioHeaders.append('x-amz-meta-owner-type', requestPayload.owner_type);
                    minioHeaders.append('x-amz-meta-owner-id', requestPayload.owner_id);
                    
                    const putResponse = await fetch(uploadData.upload_url, {
                        method: 'PUT',
                        headers: minioHeaders,
                        body: file
                    });
                    
                    if (putResponse.ok) {
                        showStatus('🚀 Файл успешно загружен в MinIO!<br>MinIO сейчас отправит вебхук, и запись появится в PostgreSQL.', 'success');
                    } else {
                        const errText = await putResponse.text();
                        showStatus('Ошибка загрузки в MinIO: ' + errText, 'error');
                    }
                    
                } catch (error) {
                    showStatus('Произошла ошибка: ' + error.message, 'error');
                }
            }
            
            function showStatus(text, className) {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = text;
                statusDiv.className = className;
                statusDiv.style.display = 'block';
            }
        </script>
    </body>
    </html>
